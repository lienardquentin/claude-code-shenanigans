schema_version: "1.0"
name: tests-first
description: The test writer writes the failing tests of a behaviour before it is built, runs them red, and touches no source.
tags: [run, tests-first]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Before anyone builds it, have Theseus's test writer write the tests of this behaviour: `ledger.average(entries)`
    answers the mean amount in cents, rounded down, and 0 for an empty ledger. The tests are run with
    `python3 -m unittest discover -s tests -q`. Wait until the tests are written (check with Theseus's tests-first tool,
    and between checks wait with `sleep 30`), then tell me which tests it wrote and how they fail.
  max_turns: 40
  timeout_seconds: 1800
  allowed_tools: [Bash, Read, Grep, Glob, ToolSearch, mcp__theseus__write_tests, mcp__theseus__tests_first, mcp__theseus__pump, mcp__theseus__pane]
runs: 1
graders:
  - type: tool_used
    name: asks the test writer
    tool: mcp__theseus__write_tests
    min: 1
  - type: regex
    name: the tests are shown red
    target: trace
    pattern: "red"
  - type: regex
    name: a test of the average is written, wherever the test writer put it
    target: trace
    pattern: "def test_[a-z_]*average"
  - type: regex
    name: the source is left for whoever builds it
    target: { source: file, path: ledger/__init__.py }
    pattern: "def average"
    match: not_contains
  - type: llm
    name: the answer names the tests and how they fail
    criteria: The final answer lists the tests written for the average (at least two, one for an empty ledger) and says they fail because average does not exist yet.
