schema_version: "1.0"
name: init
description: /theseus init proposes a project file from the project's own manifests, and writes nothing until asked.
tags: [cheap, setup]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /theseus init
  max_turns: 3
  timeout_seconds: 300
  allowed_tools: [Read]
runs: 1
graders:
  - type: regex
    name: proposes a file read from the project
    target: trace
    pattern: "What Theseus would write to \\.claude/theseus\\.toml, read from the project"
  - type: regex
    name: names the reviews it would ask for
    target: trace
    pattern: "/code-review medium"
  - type: file_exists
    name: writes nothing before --write
    path: .claude/theseus.toml
    exists: false
