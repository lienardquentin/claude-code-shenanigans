schema_version: "1.0"
name: plan-auto
description: A two-part feature, planned as tasks and built task by task by a run that goes on by itself, every task proved and reviewed.
tags: [run, plan]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use Theseus to plan local issue 2, deciding its open questions yourself, then build the plan with a run that goes on
    by itself. Wait until the run is built or stopped: check it with Theseus's run tool, and between checks wait with
    `sleep 60`. When it ends, tell me how many tasks it committed and whether every proof and review passed.
  max_turns: 120
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Grep, Glob, ToolSearch, mcp__theseus__make_plan, mcp__theseus__plan, mcp__theseus__start_run, mcp__theseus__run, mcp__theseus__pump, mcp__theseus__pane]
runs: 1
graders:
  - type: tool_used
    name: plans the local issue
    tool: mcp__theseus__make_plan
    input_match: local
    min: 1
  - type: tool_order
    name: plans before it builds
    before: mcp__theseus__make_plan
    after: mcp__theseus__start_run
  - type: regex
    name: the run ends built
    target: trace
    pattern: "\\(plan\\)[^\\n]*: built"
  - type: regex
    name: balances is on the run's branch
    target: { source: file, path: .theseus/trees/build-2-balances-by-label-and-a-report-of-them/ledger/__init__.py }
    pattern: "def balances\\("
  - type: regex
    name: report is on the run's branch
    target: { source: file, path: .theseus/trees/build-2-balances-by-label-and-a-report-of-them/ledger/__init__.py }
    pattern: "def report\\("
  - type: llm
    name: the answer says how it ended
    criteria: The final answer says the run was built, gives how many tasks it committed (more than one), and says whether every proof and review passed.
