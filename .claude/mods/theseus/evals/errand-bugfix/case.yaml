schema_version: "1.0"
name: errand-bugfix
description: A small bug, built as an errand that goes on by itself; its tests written first, the fix proved by the issue's verification and passed by the reviewers.
tags: [run, errand]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use Theseus to fix local issue 1 as an errand that goes on by itself. Then wait until its run is built or stopped:
    check it with Theseus's run tool, and between checks wait with `sleep 60`. When it ends, tell me in a few sentences
    how: what it committed, and whether its proof and its reviewers passed.
  max_turns: 60
  timeout_seconds: 3000
  allowed_tools: [Bash, Read, Grep, Glob, ToolSearch, mcp__theseus__start_errand, mcp__theseus__run, mcp__theseus__pump, mcp__theseus__pane]
runs: 1
graders:
  - type: tool_used
    name: starts an errand on the local issue
    tool: mcp__theseus__start_errand
    input_match: local
    min: 1
  - type: regex
    name: the run ends built
    target: trace
    pattern: "\\(errand\\)[^\\n]*: built"
  - type: regex
    name: the fix is on the run's branch
    target: { source: file, path: .theseus/trees/build-1-total-ignores-the-last-entry/ledger/__init__.py }
    pattern: "entries\\[:-1\\]"
    match: not_contains
  - type: regex
    name: a test of the total is on the run's branch
    target: { source: file, path: .theseus/trees/build-1-total-ignores-the-last-entry/tests/test_ledger.py }
    pattern: "total"
  - type: file_exists
    name: the person's checkout is never switched or changed
    path: .theseus/trees/build-1-total-ignores-the-last-entry/ledger/__init__.py
  - type: llm
    name: the answer says how it ended
    criteria: The final answer says the run was built, with a commit for the fix, and that its proof and its reviewers passed. It may say no pull request was opened, or that the branch is to be pushed by hand; it must not claim a pull request was opened.
