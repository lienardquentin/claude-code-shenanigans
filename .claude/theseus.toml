#:schema https://raw.githubusercontent.com/lienardquentin/theseus/main/theseus/schema/theseus.schema.json
# What Theseus proves and reviews a change by: each thing this project builds, the folder whose edits are edits of it,
# and how it is tested and checked. docs/config.md says what each key does. An edit of a target owes it a look once the
# turn ends: what changed in what it does, and whether a test pins it. A target whose folders the change did not reach
# is not played at all.

# Once a proof finds every changed run pinned, the reviewers judge the change in turn: the correctness reviewer its bugs
# at medium effort, the security reviewer its security.
review = [
  "/code-review medium",
  "/security-review",
]
# What the project rejects in a change, read from this folder and handed to both reviewers: a run's branch never loosens it
standards = ["docs/agents/standards.md"]
# The Kubernetes contexts a live stage may play in: verify reads from and runs in no other
live_contexts = ["k3d-beacons"]

# narsil, the CLI: its runs are kept by the recorder, in .claude/recorder.
[targets.narsil]
kind = "cli"
roots = ["narsil"]
tests = ["narsil/tests"]
# {tests} is filled with the tests marked on what changed, and only those run
test = "cargo test --manifest-path narsil/Cargo.toml -- --exact {tests}"
# What a change of narsil can break: its every test, a couple of seconds once built. Run on the working tree, and on
# HEAD's source only when one fails, to tell what the change broke from what was broken before it
affected = "cargo test --manifest-path narsil/Cargo.toml"
# Its lints and format, which a change may not newly fail, run as the affected tests are. Then deslop on the lines the
# change added since the commit it is compared with: a check of its own, so that a lint that failed before the change
# hides none of what it finds. An audit of its dependencies (audit = "cargo audit ...") is run only when a change
# touches Cargo.toml or Cargo.lock; none is named while cargo-audit is not installed
checks = [
  "cargo clippy --manifest-path narsil/Cargo.toml --all-targets --quiet -- -D warnings && cargo fmt --manifest-path narsil/Cargo.toml --check",
  "sh scripts/deslop.sh narsil {against}",
]

# deslop, the linter: its runs are kept by the recorder, in .claude/recorder, and it is proved and checked as narsil is.
[targets.deslop]
kind = "cli"
roots = ["deslop"]
tests = ["deslop/tests"]
test = "cargo test --manifest-path deslop/Cargo.toml -- --exact {tests}"
affected = "cargo test --manifest-path deslop/Cargo.toml"
checks = ["cargo clippy --manifest-path deslop/Cargo.toml --all-targets --quiet -- -D warnings && cargo fmt --manifest-path deslop/Cargo.toml --check"]

# Gondor, the FastAPI realm: its kept requests are played in-process on HEAD's app and the working tree's, with no
# broker and a Rohan that never answers.
[targets.gondor]
kind = "service"
app = "gondor.app:app"
roots = ["beacons/gondor"]
python = "beacons"
tests = ["beacons/tests"]
test = "uv run --quiet --project beacons pytest -v -p no:cacheprovider beacons/tests -k \"{tests: or }\""
# What a change of Gondor can break: the beacons' tests, failures named in pytest's summary
affected = "uv run --quiet --project beacons pytest -q -rfE -p no:cacheprovider beacons/tests"
# Its lints and types, which a change may not newly fail: mypy reads its settings from the beacons' pyproject, which it
# does not find from the project's folder by itself
checks = [
  "uv run --quiet --project beacons ruff check beacons/gondor && uv run --quiet --project beacons mypy --config-file beacons/pyproject.toml beacons/gondor",
  "sh scripts/deslop.sh beacons/gondor {against}",
]
env = { KAFKA_BROKERS = "", ROHAN_URL = "http://127.0.0.1:9" }
# When a request was answered: the two builds are played seconds apart, so a time in an answer is not a change of it
masks = ['\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?(Z|[+-]\d\d:?\d\d)?']
# The requests played, in order, against one app: what one does to it, the next sees. A request may carry a JSON body
# as one quoted word after its path: "POST /beacons/eilenach/light '{\"keeper\": \"Hirgon\"}'"
requests = [
  'GET /health',
  'GET /beacons',
  'GET /beacons/amon-din',
  'POST /beacons/amon-din/light',
  'GET /beacons/amon-din',
  'GET /beacons',
  'POST /beacons/amon-din/quench',
  'POST /beacons/amon-din/quench',
  'POST /beacons/mount-doom/quench',
  'GET /beacons',
  'POST /beacons/mount-doom/light',
  'POST /beacons/quench',
  'GET /palantiri',
  'GET /palantiri/anor/gaze',
  'GET /palantiri/ithil/gaze',
  'GET /palantiri/mordor/gaze',
  'POST /muster',
]

# Each build plays against an empty Postgres of its own, made in a container kept warm between proofs (started on the
# first, stopped when the session ends): what the archive writes and reads is real SQL, compared value for value
[targets.gondor.db]
image = "postgres:18-alpine"
env = "DATABASE_URL"

# Gondor puts up its tables in the background once the database answers: it is played once /health counts what burns
[targets.gondor.ready]
request = "GET /health"
match = '"lit": \d'

# Where Gondor is deployed. While it runs there, both builds are played again here against its real Postgres and
# Rohan, reached by port-forward, with the deployed workload's own variables (a secret read from its secret). A context
# whose name holds "prod" is refused. The broker is left out: forwarded, it would point the app at its in-cluster name.
# Each build plays against a copy of the deployed database of its own, both copies made from one dump so they start
# from the same rows, and both dropped after: the shared database is only read, and answers are compared by value
[targets.gondor.live]
workload = "k3d-beacons/beacons/deployment/gondor"
forward = ["postgres:5432", "rohan:8102"]
env = { KAFKA_BROKERS = "" }
db = "deployment/postgres"
scratch = "DATABASE_URL"

# Anor, the Nuxt frontend: no kept run of a frontend is compared, so its own tests alone prove a change of it, run as
# Gondor's are, verbose so each test is named as it ends. Its check is deslop's alone: its types are vue-tsc's to check
# (nuxi typecheck), which it does not hold, and Nuxt asks for Node 22.21 or later where this machine has 20
[targets.anor]
kind = "frontend"
roots = ["beacons/anor"]
tests = ["beacons/anor/tests"]
affected = "npm --prefix beacons/anor test --silent -- --reporter=verbose"
checks = ["sh scripts/deslop.sh beacons/anor {against}"]
