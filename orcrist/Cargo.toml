[package]
name = "orcrist"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

# tree-sitter's parsers are most of a run's time: built optimised even in a debug build, which is the one the Argonath runs
[profile.dev.package."*"]
opt-level = 3
