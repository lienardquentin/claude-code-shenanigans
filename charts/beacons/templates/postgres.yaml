{{- $realm := dict "root" . "realm" "postgres" -}}
# Gondor's archives: one database, which keeps nothing when its pod goes. Reached inside the cluster alone; its own
# `psql` is what palantir asks for the sessions and the tables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "beacons.labels" $realm | nindent 4 }}
spec:
  # Never two at once: the second would be another database, with none of what the first holds
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "beacons.selector" $realm | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beacons.labels" $realm | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: gondor
            - name: POSTGRES_DB
              value: beacons
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: beacons, key: POSTGRES_PASSWORD }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, gondor, -d, beacons]
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "beacons.labels" $realm | nindent 4 }}
spec:
  selector:
    {{- include "beacons.selector" $realm | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
