{{- $realm := dict "root" . "realm" "redpanda" -}}
# The broker Gondor's tidings go through: one node, which keeps nothing when its pod goes. Reached inside the
# cluster alone; its own `rpk` is what palantir asks for the topics and the consumer groups.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels:
    {{- include "beacons.labels" $realm | nindent 4 }}
spec:
  # Never two at once: the second would be another broker, with none of what the first holds
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "beacons.selector" $realm | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beacons.labels" $realm | nindent 8 }}
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.images.redpanda | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args: [redpanda, start, --mode, dev-container, --smp, "1", --overprovisioned, --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda:9092"]
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe:
            exec:
              command: [sh, -c, "rpk cluster health | grep -q 'Healthy:.*true'"]
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    {{- include "beacons.labels" $realm | nindent 4 }}
spec:
  selector:
    {{- include "beacons.selector" $realm | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
