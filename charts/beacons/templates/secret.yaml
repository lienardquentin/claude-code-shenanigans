apiVersion: v1
kind: Secret
metadata:
  name: beacons
  labels:
    {{- include "beacons.labels" (dict "root" . "realm" "beacons") | nindent 4 }}
stringData:
  RED_ARROW: {{ .Values.redArrow | quote }}
  NUXT_STEWARD_SEAL_SECRET: {{ .Values.stewardSealSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresPassword | quote }}
  # Where Gondor finds its archives, the password in it
  DATABASE_URL: {{ printf "postgresql://gondor:%s@postgres:5432/beacons" .Values.postgresPassword | quote }}
