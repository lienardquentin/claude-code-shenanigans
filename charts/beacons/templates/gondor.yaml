{{- $realm := dict "root" . "realm" "gondor" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gondor
  labels:
    {{- include "beacons.labels" $realm | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "beacons.selector" $realm | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beacons.labels" $realm | nindent 8 }}
    spec:
      containers:
        - name: gondor
          image: {{ .Values.images.gondor | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - name: ROHAN_URL
              value: http://rohan:8102
            - name: RED_ARROW
              valueFrom:
                secretKeyRef: { name: beacons, key: RED_ARROW }
          ports:
            - name: http
              containerPort: 8101
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gondor
  labels:
    {{- include "beacons.labels" $realm | nindent 4 }}
spec:
  type: {{ .Values.gondor.service.type }}
  selector:
    {{- include "beacons.selector" $realm | nindent 4 }}
  ports:
    - name: http
      port: 8101
      targetPort: http
