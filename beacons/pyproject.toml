[project]
name = "beacons"
version = "0.1.0"
description = "The Beacons of Gondor: two FastAPI services and the riders between them, something for palantir to watch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
