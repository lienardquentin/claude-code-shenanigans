[project]
name = "beacons"
version = "0.1.0"
description = "The Beacons of Gondor: two FastAPI services and the riders between them, something for the runtime mod to watch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "kafka-python>=2.2",
    "psycopg[binary,pool]>=3.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# kafka-python ships no type hints
[[tool.mypy.overrides]]
module = ["kafka", "kafka.*"]
ignore_missing_imports = true
